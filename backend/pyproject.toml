[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusmate-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "pypdf>=6,<7", "openpyxl>=3.1,<4", "alembic>=1.13,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["source_registry.yaml", "postgraduate_sources.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
