services:
  gateway:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      CAMPUSMATE_DOMAIN: ${CAMPUSMATE_DOMAIN:?Set CAMPUSMATE_DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_started}
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
